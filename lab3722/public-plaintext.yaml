# LAB-3722 scratch: public plaintext endpoint and weak HSTS. Expected: TLS/HSTS finding at critical.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=0";
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhooks
  namespace: prod
data:
  PAYMENT_CALLBACK_URL: http://api.example.com/v1/webhook
